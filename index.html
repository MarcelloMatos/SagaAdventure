<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saga Adventure – Cachoeiras e Aventura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f7f4;--card:#fff;--ink:#16302a;--mute:#5a7068;--forest:#17493a;--water:#1c8fa6;--sun:#f4b32c;--line:#d7e4de;--on-forest:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1c18;--card:#162a24;--ink:#e8f3ee;--mute:#9bb5aa;--forest:#0b3326;--line:#27403a}}
:root[data-theme="dark"]{--bg:#0e1c18;--card:#162a24;--ink:#e8f3ee;--mute:#9bb5aa;--forest:#0b3326;--line:#27403a}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.5 Nunito,system-ui,sans-serif}
h1,h2,h3{font-family:Fredoka,Nunito,sans-serif;font-weight:600;line-height:1.15;margin:0}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 40px}
header.hero{background:var(--forest);color:var(--on-forest);padding:28px 16px 34px;border-radius:0 0 28px 28px}
.hero .in{max-width:560px;margin:0 auto}
.hero h1{font-size:2.3rem}
.hero p{margin:10px 0 0;font-size:1.05rem;opacity:.92}
.hero .tag{display:inline-block;background:var(--sun);color:#3b2a00;font-weight:800;font-size:.85rem;padding:4px 12px;border-radius:99px;margin-bottom:12px}
h2.sec{font-size:1.25rem;margin:26px 0 10px}
.sub{color:var(--mute);font-size:.92rem;margin:-6px 0 12px}
.card{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;color:var(--ink);font:inherit;cursor:pointer}
.card:hover,.card:focus-visible{border-color:var(--water)}
.card .ic{font-size:1.8rem;flex:none;width:46px;height:46px;display:grid;place-items:center;background:var(--bg);border-radius:14px}
.card b{display:block;font-family:Fredoka,sans-serif;font-size:1.05rem;font-weight:500}
.card small{color:var(--mute)}
.card .pr{margin-left:auto;text-align:right;font-weight:800;color:var(--water);white-space:nowrap;font-size:.95rem}
.card .pr small{display:block;font-weight:600}
.card.info{background:transparent;border-style:dashed}
.back{background:none;border:0;color:var(--water);font:800 1rem Nunito,sans-serif;padding:18px 0 6px;cursor:pointer}
.det h2{font-size:1.8rem;margin:6px 0 6px}
.det .where{color:var(--mute);margin:0 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:.9rem;font-weight:600}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.box h3{font-size:1.05rem;margin-bottom:8px}
.box ul{margin:0;padding:0;list-style:none}
.box li{padding:4px 0 4px 26px;position:relative}
.box li::before{content:"✅";position:absolute;left:0;font-size:.85rem;top:7px}
.price{background:var(--forest);color:var(--on-forest);border-radius:18px;padding:18px;margin-bottom:14px}
.price .big{font-family:Fredoka,sans-serif;font-size:2rem;line-height:1.1}
.price .row{display:flex;justify-content:space-between;gap:10px;padding:6px 0}
.price .row+.row{border-top:1px solid rgba(255,255,255,.2)}
.price small{opacity:.85}
.btn{display:block;width:100%;text-align:center;background:var(--sun);color:#3b2a00;border:0;border-radius:99px;padding:15px;font:800 1.05rem Nunito,sans-serif;text-decoration:none;cursor:pointer}
.btn:focus-visible,.back:focus-visible,.card:focus-visible{outline:3px solid var(--water);outline-offset:2px}
.nav2{display:flex;gap:8px;margin-top:10px}
.nav2 button{flex:1;background:var(--card);border:2px solid var(--line);color:var(--ink);border-radius:99px;padding:11px;font:800 .95rem Nunito,sans-serif;cursor:pointer}
label{display:block;font-weight:800;margin:14px 0 6px}
select,input{width:100%;font:inherit;padding:13px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.cost{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:baseline}
.cost b{color:var(--water);text-align:right}
.note{color:var(--mute);font-size:.9rem}
footer{text-align:center;color:var(--mute);font-size:.85rem;padding:10px 16px 30px}
</style>
</head>
<body>
<div id="app"></div>
<footer>🌿 Saga Adventure · guias credenciados CADASTUR</footer>
<script>
// >>> TROQUE pelo seu número com DDI+DDD, só dígitos (ex.: 5524999998888)
var WHATS = "5521979632288";

var R = [
 {id:"daycircuito",ic:"🌊",g:"t",n:"Day Use – 3 Cachoeiras",sub:"Carlos Euler, Lajeado e Cachoeira Particular",from:"Resende, Barra Mansa, VR ou Penedo",pr:"R$ 180",pp:"por pessoa",ext:"em grupo regular/van",
  inc:["Transporte ida e volta","Café da manhã colonial ☕","Entradas: Carlos Euler, Lajeado e Cachoeira Particular","Guia CADASTUR","Seguro viagem"],chips:["🚌 Com transporte","🟢 Pra todo mundo"],
  pitch:"O passeio clássico: três cachoeiras num dia só, café da manhã caprichado e você nem se preocupa com a estrada. É só chegar de biquíni e sorriso."},
 {id:"adrenalina",ic:"🔥",g:"t",n:"Combo Adrenalina & VIP",sub:"Rapel + filmagem + day use",from:"Resende, Barra Mansa, VR ou Penedo",pr:"R$ 450",pp:"por pessoa",ext:"combo completo",
  inc:["Transporte ida e volta","Café da manhã colonial ☕","Rapel completo em cachoeira 🧗‍♂️ (equipe certificada + EPIs)","Filmagem com drone e GoPro 🚁","Entradas das cachoeiras","Guia + seguro aventura"],chips:["🚌 Com transporte","🔴 Aventura"],
  pitch:"Pra quem quer descer cachoeira de corda e ainda sair com o vídeo editado pra bombar nas redes. Frio na barriga garantido, segurança também."},
 {id:"passavinte",ic:"💦",g:"m",n:"Passa Vinte & Escorrega Natural",sub:"Lajeado, Escorrega e Prainha",from:"Cachoeira de Carlos Euler",pr:"R$ 130",pp:"por pessoa",ext:"mínimo 2 pessoas",car:"R$ 420",dur:"~3h30 a 4h",lv:"🟢 Fácil (ótimo pra famílias)",
  chips:["⏱ ~3h30 a 4h","🟢 Fácil","👨‍👩‍👧 Família"],pitch:"Leve e divertido: tem escorrega natural de pedra, prainha e muita risada. Perfeito pra ir com as crianças."},
 {id:"aguas",ic:"🏞",g:"m",n:"Circuito das Águas",sub:"Lajeado, Prainha, Santa Rosa e Inferno do Amaral",from:"Cachoeira de Carlos Euler",pr:"R$ 140",pp:"por pessoa",ext:"mínimo 2 pessoas",car:"R$ 460",dur:"~4h",lv:"🟡 Moderado",
  chips:["⏱ ~4h","🟡 Moderado"],pitch:"Quatro paradas, quatro águas diferentes. Tem uma caminhadinha, mas cada banho compensa."},
 {id:"fumaca",ic:"🚂",g:"m",n:"Rota Fumaça & Ponte do Trem",sub:"Cachoeira da Fumaça, Ponte Histórica e Prainha",from:"Cachoeira de Carlos Euler",pr:"R$ 160",pp:"por pessoa",ext:"mínimo 2 pessoas",car:"R$ 520",dur:"~4h30 a 5h",lv:"🟡 Moderado",
  chips:["⏱ ~4h30 a 5h","🟡 Moderado"],pitch:"Cachoeira da Fumaça, ponte histórica de trem e prainha pra fechar. O mais completo dos micro-roteiros."}
];
var MICRO_INC=["Guia/motorista local credenciado","Veículo adequado pra estrada de serra","Kit hidratação e lanche leve","Fotos e vídeos simples","Seguro individual de ecoturismo"];
var app=document.getElementById("app");
function esc(s){return s}
function go(h){location.hash=h;}
function card(r){return '<button class="card" onclick="go(\''+r.id+'\')"><span class="ic">'+r.ic+'</span><span><b>'+r.n+'</b><small>'+r.sub+'</small></span><span class="pr">'+r.pr+'<small>'+(r.g=="t"?"/pessoa":"/pessoa")+'</small></span></button>'}
function home(){
 var t=R.filter(function(r){return r.g=="t"}).map(card).join(""),m=R.filter(function(r){return r.g=="m"}).map(card).join("");
 app.innerHTML='<header class="hero"><div class="in"><span class="tag">Resende e região 🌄</span><h1>Saga Adventure</h1><p>Cachoeira, rapel e banho gelado. A gente cuida do resto, você só escolhe o rolê!</p></div></header><div class="wrap">'+
 '<h2 class="sec">Primeiro, como funciona o preço</h2><button class="card info" onclick="go(\'preco\')"><span class="ic">💡</span><span><b>Sem pegadinha</b><small>Veja como dividimos os valores</small></span></button>'+
 '<h2 class="sec">🚌 Pacotes com transporte</h2><p class="sub">A gente busca você em Resende, Barra Mansa, VR ou Penedo</p>'+t+
 '<h2 class="sec">🚗 Micro-roteiros locais</h2><p class="sub">Saindo da Cachoeira de Carlos Euler. Ideal pra quem já está por aqui ou vai de carro.</p>'+m+
 '<h2 class="sec">📅 Bora?</h2><button class="btn" onclick="go(\'reserva\')">Quero reservar minha vaga</button></div>';
}
function preco(){
 app.innerHTML='<div class="wrap"><button class="back" onclick="go(\'\')">← Voltar ao menu</button><div class="det"><h2>Como funciona o preço 💡</h2><p class="where">Transparente, em duas partes:</p></div>'+
 '<div class="box"><h3>🚐 1. Transporte e guiamento</h3><p>O transporte privativo (saindo de Resende, Barra Mansa, VR ou Penedo) é <b>dividido entre os passageiros</b>. Quanto maior o grupo, menos cada um paga!</p><p class="note">Até 4 pessoas no carro, ou grupos em van. Saída mínima equivalente a 2 pessoas.</p></div>'+
 '<div class="box"><h3>🎯 2. Atividades (valor fixo por pessoa)</h3><p class="note">Equipe exclusiva e segurança total.</p><div class="cost"><span>☕ Café da manhã colonial</span><b>R$ 35</b><span>🧗‍♂️ Rapel em cachoeira (equipe certificada + EPIs)</span><b>R$ 250</b><span>🚁 Filmagem e foto pro (drone + GoPro + vídeo editado)</span><b>R$ 80</b></div></div>'+
 '<button class="btn" onclick="go(\'\')">Ver os roteiros</button></div>';
}
function det(r){
 var i=R.indexOf(r),p=R[(i+R.length-1)%R.length],n=R[(i+1)%R.length];
 var inc=(r.inc||MICRO_INC).map(function(x){return '<li>'+x+'</li>'}).join("");
 var price=r.car?'<div class="price"><div class="row"><span>👤 Por pessoa<br><small>'+r.ext+'</small></span><span class="big">'+r.pr+'</span></div><div class="row"><span>🚗 Carro privativo<br><small>até 4 pessoas</small></span><span class="big">'+r.car+'</span></div></div>':
 '<div class="price"><small>'+r.ext+'</small><div class="big">'+r.pr+',00 <small style="font-size:1rem">'+r.pp+'</small></div></div>';
 app.innerHTML='<div class="wrap"><button class="back" onclick="go(\'\')">← Voltar ao menu</button><div class="det"><h2>'+r.ic+' '+r.n+'</h2><p class="where">📍 Saída: '+r.from+'</p></div><div class="chips">'+r.chips.map(function(c){return '<span class="chip">'+c+'</span>'}).join("")+'</div>'+
 '<p>'+r.pitch+'</p><div class="box"><h3>O que está incluso</h3><ul>'+inc+'</ul></div>'+price+
 '<button class="btn" onclick="go(\'reserva/'+r.id+'\')">Reservar este roteiro</button><div class="nav2"><button onclick="go(\''+p.id+'\')">← '+p.ic+'</button><button onclick="go(\''+n.id+'\')">'+n.ic+' →</button></div></div>';
}
function reserva(pre){
 var o=R.map(function(r){return '<option value="'+r.id+'"'+(r.id==pre?' selected':'')+'>'+r.n+'</option>'}).join("");
 app.innerHTML='<div class="wrap"><button class="back" onclick="go(\''+(pre||'')+'\')">← Voltar</button><div class="det"><h2>📅 Bora reservar!</h2><p class="where">As vagas por grupo são limitadas, pra manter tudo seguro e exclusivo. Preencha e a gente continua no WhatsApp.</p></div>'+
 '<label for="rt">Roteiro</label><select id="rt">'+o+'</select><label for="dt">Data desejada</label><input id="dt" type="date"><label for="pp">Quantas pessoas?</label><input id="pp" type="number" min="1" value="2" inputmode="numeric"><p></p>'+
 '<button class="btn" onclick="send()">Enviar pelo WhatsApp 💬</button></div>';
}
function send(){
 var r=R.filter(function(x){return x.id==document.getElementById("rt").value})[0],d=document.getElementById("dt").value,p=document.getElementById("pp").value;
 var dd=d?d.split("-").reverse().join("/"):"a combinar";
 var t="Oi, Saga Adventure! Quero reservar:\n🌿 Roteiro: "+r.n+"\n📅 Data: "+dd+"\n👥 Pessoas: "+p;
 window.open("https://wa.me/"+WHATS+"?text="+encodeURIComponent(t),"_blank");
}
function route(){
 var h=location.hash.replace("#","");window.scrollTo(0,0);
 if(!h)return home();
 if(h=="preco")return preco();
 if(h.indexOf("reserva")==0)return reserva(h.split("/")[1]);
 var r=R.filter(function(x){return x.id==h})[0];
 r?det(r):home();
}
window.addEventListener("hashchange",route);route();
</script>
</body>
</html>
